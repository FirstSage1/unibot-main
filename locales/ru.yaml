buy_invoice_subscription_description: "Ежемесячная подписка — {tokens} токенов/мес"

# Ссылка на оплату подписки через Telegram Stars
# {tariff_name} — название тарифа
# {tokens} — токенов в месяц
# {stars} — цена в Stars
# {url} — ссылка на оплату
buy_subscription_invoice_link: |
  💎 <b>Подписка: {tariff_name}</b>

  Токенов в месяц: {tokens} 💎
  Стоимость: {stars} ⭐

  👉 <a href="{url}">Оплатить подписку</a>

  Подписка будет автоматически продляться каждые 30 дней.

# Успешная оплата (разовая покупка)
# {tokens} — количество начисленных токенов
buy_success: |
  ✅ <b>Оплата прошла успешно!</b>

  Начислено: {tokens} 💎

  Используйте токены для генерации текста и изображений.

# Подписка активирована (первый платёж)
# {tokens} — количество токенов в месяц
buy_subscription_activated: |
  ✅ <b>Подписка активирована!</b>

  Начислено: {tokens} 💎 на месяц

  Подписка будет автоматически продляться каждые 30 дней.
  Управляйте подпиской в /settings

# Подписка продлена (автоматический платёж)
# {tokens} — количество токенов
buy_subscription_renewed: |
  ✅ <b>Подписка продлена!</b>

  Начислено: {tokens} 💎

  Спасибо, что остаётесь с нами!

# Ошибки покупки
buy_no_providers: "❌ Способы оплаты не настроены. Обратитесь к администратору."
buy_no_tariffs: "❌ Тарифы не настроены. Обратитесь к администратору."
buy_tariff_not_found: "❌ Тариф не найден."
buy_provider_not_configured: "❌ Выбранный способ оплаты не настроен."
buy_tariff_not_available_for_provider: "❌ Тариф недоступен для выбранного способа оплаты."
buy_payment_error: "❌ Ошибка создания платежа. Попробуйте позже."
buy_error_no_url: "❌ Не удалось получить ссылку на оплату."
buy_payment_failed: "❌ Оплата не прошла. Попробуйте ещё раз."
buy_payment_refunded: "💸 Возврат {amount} ⭐ Stars выполнен."

# ==============================================================================
# РЕФЕРАЛЬНАЯ СИСТЕМА (/invite)
# ==============================================================================

# Основное сообщение с реферальной ссылкой и статистикой
# {link} — реферальная ссылка
# {total_referrals} — количество приглашённых
# {total_earnings} — заработано токенов
# {inviter_bonus} — бонус за одного реферала
# {max_earnings} — максимум заработка (0 = без лимита)
invite_info: |
  👥 <b>Реферальная программа</b>

  Ваша ссылка для приглашения:
  <code>{link}</code>

  📊 <b>Статистика:</b>
  • Приглашено друзей: <b>{total_referrals}</b>
  • Заработано токенов: <b>{total_earnings}</b> 💎

  💡 <b>Условия:</b>
  • За каждого друга вы получаете <b>{inviter_bonus}</b> 💎

  📤 Поделитесь ссылкой с друзьями!

# Реферальная программа отключена
invite_disabled: |
  ❌ Реферальная программа временно недоступна.

# Есть невыплаченные бонусы (при require_payment=true)
# {count} — количество невыплаченных бонусов
invite_pending_bonuses: |
  ⏳ <b>Ожидают выплаты:</b> {count} бонусов
  (будут начислены после первой покупки приглашённого)

# Достигнут лимит заработка
invite_max_reached: |
  ⚠️ Вы достигли максимального заработка через реферальную программу.
  Спасибо за активное участие!

# Бонус приглашённому при регистрации
# {amount} — количество токенов
referral_invitee_bonus: |
  🎁 <b>Бонус за приглашение!</b>

  Вам начислено <b>{amount}</b> 💎 за регистрацию по реферальной ссылке!

