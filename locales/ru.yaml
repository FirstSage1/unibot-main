# Сообщение команды /terms — показ ссылок на документы
legal_documents_message: |
  📜 <b>Юридические документы</b>

  Ознакомьтесь с условиями использования сервиса:

# Кнопка "Политика конфиденциальности"
legal_privacy_policy_button: "🔒 Политика конфиденциальности"

# Кнопка "Пользовательское соглашение"
legal_terms_of_service_button: "📋 Пользовательское соглашение"

# Кнопка "Принимаю"
legal_accept_button: "✅ Принимаю условия"

# Запрос на согласие с документами (показывается при первом /start)
legal_acceptance_request: |
  📜 <b>Добро пожаловать!</b>

  Перед началом работы, пожалуйста, ознакомьтесь с юридическими документами:

  • <b>Политика конфиденциальности</b> — как мы обрабатываем ваши данные
  • <b>Пользовательское соглашение</b> — условия использования сервиса

  Нажимая «Принимаю условия», вы подтверждаете, что ознакомились с документами и соглашаетесь с их условиями.

# Уведомление после нажатия "Принимаю" (всплывающее)
legal_accepted_notification: "✅ Спасибо! Условия приняты."

# Сообщение после принятия условий
legal_accepted_message: |
  ✅ <b>Условия приняты</b>

  Спасибо, что ознакомились с документами!
  Теперь вы можете пользоваться всеми функциями бота.

# Сообщение если пользователь уже принял условия
legal_already_accepted: "Вы уже приняли эти условия"

# Сообщение если юридические документы отключены
legal_disabled: |
  ℹ️ Юридические документы в данный момент недоступны.

# Сообщение если ссылки на документы не настроены
legal_not_configured: |
  ⚠️ Юридические документы ещё не настроены.

  Обратитесь к администратору бота.

