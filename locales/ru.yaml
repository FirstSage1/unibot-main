# Сообщение при отсутствии подписки на обязательный канал
# Показывается когда пользователь пытается использовать бота без подписки
channel_subscription_required: |
  ⚠️ <b>Требуется подписка на канал</b>

  Для использования бота необходимо подписаться на наш канал.

  После подписки нажмите кнопку «Проверить подписку».

# Текст кнопки для перехода на канал
channel_subscription_button: "📢 Подписаться на канал"

# Текст кнопки для проверки подписки (callback)
channel_subscription_check_button: "🔄 Проверить подписку"

# Сообщение когда пользователь нажал "Проверить подписку", но не подписался
channel_subscription_not_subscribed: |
  ❌ Вы ещё не подписаны на канал.

  Пожалуйста, подпишитесь на канал и нажмите кнопку проверки снова.

# Сообщение после успешной подписки
# Показывается когда пользователь подписался и нажал "Проверить подписку"
channel_subscription_thanks: |
  ✅ Спасибо за подписку!

  Теперь вы можете пользоваться ботом.
  Нажмите /start чтобы начать.
