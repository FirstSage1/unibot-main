# Заголовок меню настроек
settings_title: |
  ⚙️ <b>Настройки</b>

  Выберите параметр для изменения:

# Кнопка смены языка
settings_language_button: "🌍 Язык интерфейса"

# Кнопка управления подпиской (будет использоваться позже)
settings_subscription_button: "📦 Управление подпиской"

# Кнопка "Назад" для возврата в меню настроек
settings_back_button: "← Назад"

# Сообщение если нет доступных настроек
settings_no_options: |
  ⚙️ <b>Настройки</b>

  В данный момент нет доступных настроек для изменения.

# Подтверждение смены языка в настройках
# {language_name} — название выбранного языка
settings_language_changed: |
  ✅ Язык интерфейса изменён на <b>{language_name}</b>

  Выберите другой параметр или закройте меню:

# Управление подпиской
# {tariff_name} — название тарифа, {period_end} — дата окончания, {tokens_remaining} — остаток токенов
settings_subscription_info: |
  📦 <b>Подписка</b>

  Тариф: {tariff_name}
  Токены: {tokens_remaining} 💎
  До: {period_end}
  Автопродление: {auto_renewal}

# Кнопка отмены подписки
settings_subscription_cancel_button: "❌ Отменить подписку"

# Кнопка включения автопродления
settings_subscription_enable_auto_renewal_button: "✅ Включить автопродление"

# Подтверждение отмены подписки
settings_subscription_cancel_confirm: |
  ⚠️ <b>Подтверждение отмены</b>

  Вы уверены, что хотите отменить подписку?

  Подписка останется активной до {period_end}, затем автоматически продляться не будет.

# Кнопка подтверждения отмены
settings_subscription_cancel_confirm_yes: "✅ Да, отменить"

# Кнопка отказа от отмены
settings_subscription_cancel_confirm_no: "← Назад"

# Подписка успешно отменена
settings_subscription_canceled: |
  ✅ Подписка отменена

  Подписка будет активна до {period_end}, после чего автоматически завершится.

  Вы можете в любой момент включить автопродление обратно.

# Автопродление включено
settings_subscription_auto_renewal_enabled: |
  ✅ Автопродление включено

  Подписка будет автоматически продляться после {period_end}.

# Ошибка восстановления подписки (для Telegram Stars)
settings_subscription_restore_failed: |
  ❌ Не удалось восстановить подписку.
  Возможно, подписка уже истекла.

# Сообщение если нет активной подписки
settings_subscription_none: |
  📦 <b>Подписка</b>

  У вас нет активной подписки.

  Приобрести подписку можно в /balance

