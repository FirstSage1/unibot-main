# ==============================================================================
# РУССКИЙ ЯЗЫК (ru)
# ==============================================================================
#
# Файл содержит все текстовые строки интерфейса бота на русском языке.
# При добавлении нового языка скопируйте этот файл и переведите все значения.
#
# Формат: ключ: значение
# Многострочный текст: используйте | для сохранения переносов строк

# ==============================================================================
# ОБЩИЕ СООБЩЕНИЯ
# ==============================================================================

# Приветственное сообщение при /start
# Показывает список основных доступных команд бота.
# Некоторые команды могут быть отключены в config.yaml.
start_message: |
  👋 <b>Привет! Я бот для AI-генерации.</b>

  📋 <b>Доступные команды:</b>

  💬 /chatgpt — диалог с нейросетью
  📝 /generate — описание товара для маркетплейса
  🎨 /imagine — генерация изображений
  ✏️ /edit_image — редактирование изображений
  🛍️ /card — фото товара для маркетплейса
  🗑️ /clear — очистить историю диалога
  💰 /balance — проверить баланс
  ⚙️ /settings — настройки
  ❓ /help — помощь

  💡 Начните с команды /chatgpt или /imagine!

# Сообщение при выборе команды /language
language_command: "Выберите язык интерфейса:"

# Сообщение после успешной смены языка
# {language_name} — название выбранного языка
language_changed: "✅ Язык интерфейса изменён на {language_name}"

# ==============================================================================
# НАЗВАНИЯ ЯЗЫКОВ (для отображения в меню)
# ==============================================================================

language_name_ru: "🇷🇺 Русский"
language_name_en: "🇬🇧 English"
language_name_zh: "🇨🇳 中文"
language_name_es: "🇪🇸 Español"
language_name_fr: "🇫🇷 Français"
language_name_de: "🇩🇪 Deutsch"
language_name_it: "🇮🇹 Italiano"
language_name_pt: "🇵🇹 Português"
language_name_ja: "🇯🇵 日本語"
language_name_ko: "🇰🇷 한국어"
language_name_ar: "🇸🇦 العربية"
language_name_hi: "🇮🇳 हिन्दी"
language_name_tr: "🇹🇷 Türkçe"
language_name_pl: "🇵🇱 Polski"

# ==============================================================================
# ОШИБКИ
# ==============================================================================

# Неизвестная ошибка
error_unknown: "❌ Произошла ошибка. Попробуйте ещё раз."

# Язык не поддерживается
error_language_not_supported: "❌ Этот язык пока не поддерживается."

# Пользователь не найден
error_user_not_found: "❌ Ошибка: пользователь не найден. Используйте /start для регистрации."

# Временная ошибка БД
error_db_temporary: "❌ Временная ошибка БД. Попробуйте ещё раз через несколько секунд."

# Постоянная ошибка БД
error_db_permanent: |
  ❌ Ошибка при работе с базой данных.
  Попробуйте ещё раз или обратитесь в поддержку.

# Неожиданная ошибка
error_unexpected: |
  ❌ Произошла неожиданная ошибка.
  Попробуйте ещё раз или обратитесь в поддержку.

# Ошибка генерации AI (единый ключ для всех типов)
generation_error: |
  ❌ Ошибка генерации.
  Попробуйте ещё раз или выберите другую модель.

# Неожиданная ошибка при генерации (единый ключ для всех типов)
generation_unexpected_error: |
  ❌ Произошла неожиданная ошибка при генерации.
  Попробуйте ещё раз или обратитесь в поддержку.

# Ошибка: данные callback не найдены
error_callback_data: "❌ Ошибка: данные не найдены"

# Нет доступных моделей (API-ключи не настроены)
# Показывается когда пользователь пытается использовать команду,
# но для неё нет ни одной модели с настроенным провайдером.
no_models_available: |
  ❌ <b>Модели недоступны</b>

  Для этой функции не настроены API-ключи провайдеров.
  Обратитесь к администратору бота для настройки.

# Неизвестная команда (когда команда не зарегистрирована или отключена)
# Показывается fallback-обработчиком для любых команд, которые не были обработаны.
# {command} — команда, которую ввёл пользователь (без /)
command_not_found: |
  ❓ Команда <code>/{command}</code> не найдена.

  Используйте /help для списка доступных команд.

# Тестовая ошибка успешно вызвана
# Используется командой /error для проверки системы мониторинга
error_test_triggered: |
  🔴 Тестовая ошибка успешно вызвана!

  Это сообщение подтверждает, что:
  • Команда /error работает
  • Ошибка залогирована в терминале
  • Система мониторинга уведомлена

# ==============================================================================
# CHATGPT (ДИАЛОГ С AI)
# ==============================================================================

# Сообщение при выборе модели для диалога
chatgpt_choose_model: |
  🤖 <b>Выберите модель для диалога:</b>

  После выбора вы сможете общаться с AI.
  Все предыдущие сообщения будут учитываться в контексте.

  💡 Используйте /clear для очистки истории диалога.

# Подтверждение выбора модели
# {model_key} — ключ выбранной модели
chatgpt_model_selected: |
  ✅ Модель выбрана: <b>{model_key}</b>

  Теперь пишите сообщения, и AI будет отвечать.
  Вся история диалога сохраняется и учитывается в ответах.

  🔄 Для смены модели используйте /chatgpt
  🗑 Для очистки истории используйте /clear

# Ошибка: модель не выбрана
chatgpt_model_not_selected: "❌ Ошибка: модель не выбрана. Используйте /chatgpt для начала."

# Генерация ответа в процессе
chatgpt_generating: "⏳ Генерирую ответ..."

# AI вернул пустой ответ
chatgpt_empty_response: "❌ Ошибка: AI вернул пустой ответ. Попробуйте ещё раз."

# Ошибка генерации AI
# {error} — текст ошибки
chatgpt_generation_error: |
  ❌ Ошибка генерации: {error}

  Попробуйте ещё раз или выберите другую модель через /chatgpt.

# Ошибка генерации для chat (используется в base.py)
# Ключ соответствует generation_type="chat" в ChatGenerationService
# {error} — текст ошибки
chat_generation_error: |
  ❌ Ошибка генерации: {error}

  Попробуйте ещё раз или выберите другую модель через /chatgpt.

# ==============================================================================
# IMAGINE (ГЕНЕРАЦИЯ ИЗОБРАЖЕНИЙ)
# ==============================================================================

# Сообщение при выборе модели для изображений
imagine_choose_model: |
  🎨 <b>Выберите модель для генерации изображения:</b>

  После выбора вы сможете ввести текстовое описание желаемого изображения.

  💡 Чем подробнее описание — тем лучше результат!

# Подтверждение выбора модели
# {model_key} — ключ выбранной модели
imagine_model_selected: |
  ✅ Модель выбрана: <b>{model_key}</b>

  Теперь опишите желаемое изображение текстом.

  📝 Примеры:
  • Величественный дракон, летящий над средневековым замком на закате
  • Улица в стиле киберпанк с неоновыми огнями и дождём
  • Милая красная панда, жующая бамбук в лесу

  🔄 Для выбора другой модели используйте /imagine

# Ошибка: модель не выбрана
imagine_model_not_selected: "❌ Ошибка: модель не выбрана. Используйте /imagine для начала."

# Генерация изображения в процессе
imagine_generating: "⏳ Генерирую изображение..."

# AI вернул пустой ответ
imagine_empty_response: "❌ Ошибка: AI вернул пустой ответ. Попробуйте ещё раз."

# Изображение успешно сгенерировано
# {model_key} — ключ модели, {prompt} — текст запроса (обрезается до 200 символов)
imagine_generated: |
  🎨 Изображение сгенерировано моделью <b>{model_key}</b>

  Промпт: {prompt}

# Ошибка генерации AI
# {error} — текст ошибки
imagine_generation_error: &image_error |
  ❌ Ошибка генерации: {error}

  Попробуйте ещё раз или выберите другую модель через /imagine.

# Алиас для generation_type="image" (используется в base.py)
image_generation_error: *image_error

