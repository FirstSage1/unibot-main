# ==============================================================================
# КОНФИГУРАЦИЯ UNIBOT
# ==============================================================================
#
# Этот файл содержит настройки, которые можно менять без перезапуска бота
# (в будущих версиях). Сейчас для применения изменений нужен перезапуск.
#
# Формат: YAML (https://yaml.org)
# Отступы важны! Используйте 2 пробела для вложенности.


# ==============================================================================
# AI-МОДЕЛИ
# ==============================================================================
#
# Конфигурация AI-моделей для генерации контента.
# Каждая модель имеет уникальный ключ (используется в интерфейсе бота).
#
# Поддерживаемые провайдеры:
#   routerai   — российский сервис (https://routerai.ru)
#                Доступ к современным моделям: GPT-5, Gemini, DeepSeek и др.
#                Работает из России без VPN. Оплата в рублях.
#                API-ключ: https://routerai.ru (личный кабинет → API-ключи)
#                Документация: https://routerai.ru/docs/guides
#
#   openrouter — агрегатор моделей (https://openrouter.ai)
#                Доступ к сотням моделей: GPT, Claude, FLUX и др.
#                API-ключ: https://openrouter.ai/keys
#                ⚠️  Может потребоваться прокси для доступа из России
#
# Обязательные поля:
#   provider        — провайдер API (openrouter или routerai)
#   model_id        — ID модели на стороне провайдера
#   generation_type — тип генерации (chat, image, tts, stt)
#   price_tokens    — стоимость одной генерации в токенах
#
# Опциональные поля:
#   display_name — название для отображения пользователю
#   description  — описание модели
#   params       — параметры по умолчанию для модели
#
# ВАЖНО: Модель по умолчанию для каждого типа генерации (chat, image) —
#        это ПЕРВАЯ модель в списке. Порядок моделей имеет значение!

models:
  # ==========================================================================
  # ТЕКСТОВЫЕ МОДЕЛИ (chat)
  # ==========================================================================
  #
  # Модели для текстовых диалогов. Используются для ответов на вопросы,
  # генерации текста, перевода, анализа и других текстовых задач.
  #
  # ⭐ Первая модель в списке — модель по умолчанию для chat-генераций.

  gpt-5-nano:
    provider: routerai
    # RouterAI использует формат "owner/model" для model_id
    model_id: openai/gpt-5-nano
    generation_type: chat
    # Стоимость для пользователя в токенах бота (можно изменить позже).
    price_tokens: 5
    display_name: "GPT-5 Nano"
    description: "Облегчённая версия GPT-5. Быстрая и дешёвая, подходит для простых задач."
    # Системный промпт — первое сообщение в диалоге, определяющее поведение AI.
    # Можно настроить роль, стиль общения, ограничения и т.д.
    # Если не указан — модель работает в режиме "обычного помощника".
    system_prompt: "Ты — полезный AI-ассистент. Отвечай на русском языке, если пользователь не попросит иначе. Будь вежливым, кратким и точным."
    cost:
      # Себестоимость в рублях за 1000 токенов (для расчёта маржинальности).
      # Цены взяты с RouterAI: 5₽ за 1M входящих, 40₽ за 1M исходящих.
      input_tokens_rub_per_1k: 0.005   # ₽5 за 1M токенов = ₽0.005 за 1k
      output_tokens_rub_per_1k: 0.040  # ₽40 за 1M токенов = ₽0.040 за 1k
    params:
      # Максимальное количество токенов в ответе.
      # 4096 — достаточно для развёрнутых ответов.
      # GPT-5 Nano поддерживает до 400K токенов контекста.
      max_tokens: 4096
      # Температура генерации (0.0 - 2.0).
      # 0.7 — баланс между креативностью и точностью.
      temperature: 0.7

  gpt-5-2:
    provider: routerai
    model_id: openai/gpt-5.2
    generation_type: chat
    # Стоимость для пользователя в токенах бота (можно изменить позже).
    # Рекомендация: 15-25 токенов, так как модель дорогая, но очень мощная.
    price_tokens: 20
    display_name: "GPT-5.2"
    description: "Новейшая frontier-модель с адаптивным рассуждением. Лучшая для сложных задач: математика, код, наука."
    system_prompt: "Ты — полезный AI-ассистент. Отвечай на русском языке, если пользователь не попросит иначе. Будь вежливым, кратким и точным."
    cost:
      # Цены взяты с RouterAI: 177₽ за 1M входящих, 1423₽ за 1M исходящих.
      input_tokens_rub_per_1k: 0.177   # ₽177 за 1M токенов = ₽0.177 за 1k
      output_tokens_rub_per_1k: 1.423  # ₽1423 за 1M токенов = ₽1.423 за 1k
    params:
      max_tokens: 4096
      temperature: 0.7

  deepseek-chat-v3-1:
    provider: routerai
    model_id: deepseek/deepseek-chat-v3.1
    generation_type: chat
    # Стоимость для пользователя в токенах бота (можно изменить позже).
    # Рекомендация: 8-12 токенов (дешевле GPT-5.2, но дороже GPT-5 Nano).
    price_tokens: 10
    display_name: "DeepSeek V3.1"
    description: "Крупная модель рассуждений (671B параметров). Отлично для кода, исследований, агентных задач."
    system_prompt: "Ты — полезный AI-ассистент. Отвечай на русском языке, если пользователь не попросит иначе. Будь вежливым, кратким и точным."
    cost:
      # Цены взяты с RouterAI: 20₽ за 1M входящих, 80₽ за 1M исходящих.
      input_tokens_rub_per_1k: 0.020   # ₽20 за 1M токенов = ₽0.020 за 1k
      output_tokens_rub_per_1k: 0.080  # ₽80 за 1M токенов = ₽0.080 за 1k
    params:
      max_tokens: 4096
      temperature: 0.7

  # ==========================================================================
  # МОДЕЛИ ДЛЯ ИЗОБРАЖЕНИЙ (image)
  # ==========================================================================
  #
  # Модели для генерации изображений по текстовому описанию.
  # RouterAI поддерживает генерацию через GPT-5 Image и Gemini.
  #
  # ⭐ Первая модель в списке — модель по умолчанию для image-генераций.

  gpt-5-image-mini:
    provider: routerai
    model_id: openai/gpt-5-image-mini
    generation_type: image
    # Стоимость для пользователя в токенах бота (можно изменить позже).
    # Рекомендация: 10-15 токенов для самой дешёвой модели изображений.
    price_tokens: 10
    display_name: "GPT-5 Image Mini"
    description: "Комбинированная модель: языковые возможности GPT-5 Mini + генерация изображений. Быстрая и дешёвая."
    cost:
      # Цена за генерацию: 0.81₽ за 1k токенов генерации.
      # Для упрощения используем per_request_rub, так как обычно генерится одно изображение.
      per_request_rub: 0.81
    params:
      # Размер изображения. Варианты зависят от модели.
      # Стандартные: "1024x1024", "1792x1024", "1024x1792"
      size: "1024x1024"
      # Качество изображения: "standard" или "hd" (если поддерживается).
      quality: "standard"

  gemini-2-5-flash-image:
    provider: routerai
    model_id: google/gemini-2.5-flash-image
    generation_type: image
    # Стоимость для пользователя в токенах бота (можно изменить позже).
    # Рекомендация: 15-20 токенов (дороже GPT-5 Image Mini, но более продвинутая).
    price_tokens: 15
    display_name: "Gemini 2.5 Flash Image"
    description: "Современная модель от Google с контекстуальным пониманием. Генерация, редактирование, многоходовые диалоги."
    cost:
      # Цена за генерацию: 3.05₽ за 1k токенов генерации.
      per_request_rub: 3.05
    params:
      size: "1024x1024"
      quality: "standard"
      # Модель возвращает ТОЛЬКО изображение без текстового ответа.
      # Этот параметр указывает провайдеру использовать специальный промпт
      # для генерации изображения без лишних вопросов и комментариев.
      image_only: true

  flux-2-pro:
    provider: routerai
    model_id: black-forest-labs/flux.2-pro
    generation_type: image
    # Стоимость для пользователя в токенах бота.
    # FLUX.2 Pro — модель премиум-класса с высоким качеством изображений.
    # Рекомендация: 25-35 токенов (дороже Gemini, но лучшее качество).
    price_tokens: 30
    display_name: "FLUX.2 Pro"
    description: "Премиум-модель от Black Forest Labs. Высокое визуальное качество, чёткие текстуры, стабильное освещение. До 4MP."
    cost:
      # Цена: 372₽ за 1M токенов (вход и выход).
      # Ценообразование на основе мегапикселей.
      per_request_rub: 5.00
    params:
      size: "1024x1024"
      quality: "standard"

  # ==========================================================================
  # МОДЕЛИ ДЛЯ РЕДАКТИРОВАНИЯ ИЗОБРАЖЕНИЙ (image_edit)
  # ==========================================================================
  #
  # Модели для редактирования изображений по текстовому описанию.
  # Пользователь отправляет изображение + описание изменений.
  # Модель возвращает отредактированное изображение.
  #
  # Используется мультимодальный Chat API с vision-возможностями.
  #
  # ⭐ Первая модель в списке — модель по умолчанию для image_edit-генераций.

  gemini-2-5-flash-image-edit:
    provider: routerai
    # Та же модель, что и для генерации — она поддерживает и редактирование
    model_id: google/gemini-2.5-flash-image
    generation_type: image_edit
    # Стоимость для пользователя в токенах бота.
    # Редактирование обычно дороже генерации, т.к. требует анализа изображения.
    price_tokens: 20
    display_name: "Gemini 2.5 Flash (редактирование)"
    description: "Быстрое редактирование изображений. Добавление объектов, изменение стиля, цветокоррекция."
    cost:
      per_request_rub: 3.05
    params:
      max_tokens: 4096

  gemini-3-pro-image-edit:
    provider: routerai
    model_id: google/gemini-3-pro-image-preview
    generation_type: image_edit
    # Более мощная модель — дороже, но качественнее
    price_tokens: 30
    display_name: "Gemini 3 Pro (редактирование)"
    description: "Продвинутое редактирование с глубоким пониманием контекста. Лучше для сложных изменений."
    cost:
      per_request_rub: 5.00
    params:
      max_tokens: 4096

  gpt-5-image-mini-edit:
    provider: routerai
    model_id: openai/gpt-5-image-mini
    generation_type: image_edit
    # Самая дешёвая модель для редактирования
    price_tokens: 15
    display_name: "GPT-5 Image Mini (редактирование)"
    description: "Бюджетное редактирование изображений. Хорошо для простых изменений."
    cost:
      per_request_rub: 0.81
    params:
      max_tokens: 4096


# ==============================================================================
# ТАЙМАУТЫ ГЕНЕРАЦИИ
# ==============================================================================
#
# Максимальное время ожидания ответа от AI-провайдера (в секундах).
# Если за это время ответ не пришёл — генерация считается неудачной.
#
# ВАЖНО: Разные типы генерации занимают разное время!
#   - Текст (chat): обычно 5-30 секунд
#   - Изображения (image): 30 секунд - 2 минуты
#   - Редактирование (image_edit): аналогично генерации изображений
#
# Если поставить слишком маленький таймаут — генерации будут обрываться.
# Если слишком большой — пользователь будет долго ждать при зависании API.

generation_timeouts:
  chat: 60         # Текстовые ответы (GPT-5, DeepSeek и аналоги)
  image: 180       # Генерация изображений (GPT-5 Image, Gemini)
  image_edit: 180  # Редактирование изображений


# ==============================================================================
# ЛИМИТЫ И ЗАЩИТА ОТ СПАМА
# ==============================================================================
#
# Эти настройки защищают бота от злоупотреблений и спама.

limits:
  # Сколько генераций пользователь может запустить одновременно.
  # Например, если 2 — пользователь может запустить генерацию изображения,
  # и пока она идёт, запросить ещё одну. Но третью — уже нет.
  #
  # Зачем нужно: защита от спамеров, которые могут заспамить бота запросами.
  # Рекомендуемое значение: 2-3
  max_parallel_tasks_per_user: 2

  # Максимальное количество сообщений в контексте диалога, которые AI "помнит".
  # Большой контекст улучшает качество диалога, но увеличивает расход токенов.
  # Рекомендуемое значение: 10-25.
  max_context_messages: 20

  # Минимальный интервал между НОВЫМИ запросами одного типа (в секундах).
  # Даже если предыдущая генерация завершилась, нельзя сразу запустить новую.
  #
  # Зачем нужно: защита от случайных двойных кликов и намеренного спама.
  # Если пользователь случайно нажмёт 2 раза — не потратит токены дважды.
  generation_cooldowns:
    chat: 2         # Между текстовыми запросами — 2 секунды
    image: 10       # Между генерациями изображений — 10 секунд
    image_edit: 10  # Между редактированиями изображений — 10 секунд
    tts: 5          # Между озвучками — 5 секунд
    stt: 5          # Между распознаваниями — 5 секунд


# ==============================================================================
# КОМАНДЫ БОТА
# ==============================================================================
#
# Управление доступностью команд бота.
# Каждая команда может быть включена/выключена и показана/скрыта в меню.
#
# ВАЖНО: Если команда не указана в этом разделе — она считается ОТКЛЮЧЁННОЙ!
# Это обеспечивает явный контроль над доступными командами.
#
# Структура каждой команды:
#   enabled: true/false
#     Включена ли команда.
#     - true: роутер подключается, команда работает
#     - false: роутер НЕ подключается, команда полностью недоступна
#     Если команда включена, но её зависимости (API ключи и т.д.) не настроены —
#     пользователь увидит ошибку при использовании. Это ожидаемое поведение:
#     так администратор узнает, что нужно настроить зависимости.
#
#   show_in_menu: true/false
#     Показывать ли команду в меню Telegram (кнопка "/" в интерфейсе).
#     - true: команда видна в меню
#     - false: команда работает, но не видна в меню (например, /start)
#
#   menu_description:
#     Описание команды для меню Telegram на разных языках.
#     Ключ — код языка (ru, en, и т.д.).
#     Telegram показывает меню на языке пользователя:
#     - Если язык есть в available_languages — видит локализованное описание
#     - Если нет — видит описание на default_language (ru)
#
# Порядок команд в этом разделе определяет порядок в меню Telegram.

commands:
  # /start — перезапуск бота и список доступных команд
  # ПЕРВАЯ команда в меню бота (порядок регистрации задаётся в registry.py).
  # При вызове:
  # - Новым пользователям: регистрация + приветствие + список команд
  # - Существующим: обновление профиля + список команд
  # Также обрабатывает deep links (t.me/bot?start=...) для реферальной программы.
  start:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "🔄 Перезапуск бота"
      en: "🔄 Restart the bot"

  # /chatgpt — диалог с AI-моделями
  # Основная команда для текстового общения с AI.
  # Пользователь выбирает модель и ведёт диалог с сохранением контекста.
  chatgpt:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "💬 Диалог с ИИ"
      en: "💬 Chat with AI"

  # /imagine — генерация изображений
  # Создание изображений по текстовому описанию.
  imagine:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "🎨 Сгенерировать изображение"
      en: "🎨 Generate image"

  # /edit_image — редактирование изображений
  # Изменение существующих изображений по текстовому описанию.
  # Пользователь отправляет изображение + описание изменений.
  edit_image:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "✏️ Редактировать изображение"
      en: "✏️ Edit image"

  # /clear — очистка истории диалога
  # Удаляет контекст диалога для текущей модели.
  # Полезно если AI "застрял" или контекст стал слишком большим.
  clear:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "🗑️ Очистить историю"
      en: "🗑️ Clear history"

  # /language — смена языка интерфейса
  # Показывает клавиатуру с доступными языками.
  # ВАЖНО: Работает только если localization.enabled=true (см. ниже).
  # Если мультиязычность отключена — команда автоматически игнорируется.
  language:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "🌍 Сменить язык"
      en: "🌍 Change language"

  # /balance — просмотр баланса токенов
  # Показывает текущий баланс токенов пользователя.
  # Работает только если billing.enabled=true (см. раздел billing).
  balance:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "💰 Мой баланс"
      en: "💰 My balance"

  # Покупка токенов (через кнопку в /balance)
  # Показывает тарифы и способы оплаты для пополнения баланса.
  # Поддерживаемые провайдеры: Telegram Stars, YooKassa, Stripe.
  # Автоматически показывает только настроенные провайдеры.
  # ВАЖНО: Отключена по умолчанию. Включите когда настроите провайдеры оплаты.
  # Команда /buy убрана — покупка только через кнопку в /balance.
  # show_in_menu: false — не показывать в меню команд.
  buy:
    enabled: true
    show_in_menu: false
    menu_description:
      ru: "🛒 Купить токены"
      en: "🛒 Buy tokens"

  # /invite — реферальная программа
  # Генерирует персональную ссылку для приглашения друзей.
  # ВАЖНО: Автоматически отключается если referral.enabled=false.
  invite:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "👥 Пригласить друга"
      en: "👥 Invite a friend"

  # /settings — настройки пользователя
  # Позволяет управлять настройками: язык интерфейса, подписка и т.д.
  # Объединяет функции /language и управления подпиской в одном месте.
  settings:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "⚙️ Настройки"
      en: "⚙️ Settings"

  # /help — помощь и поддержка
  # Показывает информацию о боте и контакт для обращения в поддержку.
  # Контакт поддержки настраивается в секции support.contact ниже.
  help:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "❓ Помощь"
      en: "❓ Help"

  # /terms — юридические документы (оферта, политика конфиденциальности)
  # ВАЖНО: Команда автоматически отключается, если не настроены ссылки на документы!
  # Для включения укажите в секции legal:
  #   - privacy_policy_url: ссылка на Политику конфиденциальности
  #   - terms_of_service_url: ссылка на Пользовательское соглашение
  terms:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "📄 Документы"
      en: "📄 Legal"

  # /error — тестирование системы отслеживания ошибок
  # Команда для разработчиков — генерирует тестовую ошибку.
  # Полезна для проверки работы Telegram-алертов и системы логирования.
  #
  # По умолчанию включена и видна в меню. Администратор может:
  #   - Скрыть из меню: show_in_menu: false
  #   - Полностью отключить: enabled: false
  error:
    enabled: true
    show_in_menu: true
    menu_description:
      ru: "⚠️ Тестовая ошибка"
      en: "⚠️ Test error"

# ==============================================================================
# ЛОКАЛИЗАЦИЯ (МУЛЬТИЯЗЫЧНОСТЬ)
# ==============================================================================
#
# Настройки поддержки разных языков интерфейса бота.
# Переводы хранятся в файлах locales/<lang>.yaml
#
# По умолчанию мультиязычность ОТКЛЮЧЕНА — бот работает только на русском.
# Для включения: установите enabled: true и добавьте языки в available_languages.

localization:
  # Включить/выключить поддержку мультиязычности.
  # false = бот всегда использует default_language, команда /language скрыта.
  # true = пользователи могут выбирать язык через команду /language.
  #
  # ВАЖНО: При enabled: false команда /language автоматически скрывается из меню.
  enabled: false

  # Язык по умолчанию.
  # Используется если:
  #   - Telegram не передал язык пользователя
  #   - Язык пользователя отсутствует в списке доступных
  #   - Мультиязычность отключена (enabled: false)
  # Формат: двухбуквенный код языка по ISO 639-1 (ru, en, zh, es, etc.)
  default_language: ru

  # Список доступных языков.
  # Для каждого языка должен существовать файл locales/<lang>.yaml
  # Например:
  #   - ru → locales/ru.yaml
  #   - en → locales/en.yaml
  #   - zh → locales/zh.yaml
  #
  # При добавлении нового языка:
  # 1. Создайте файл locales/<lang>.yaml
  # 2. Скопируйте структуру из ru.yaml
  # 3. Переведите все строки
  # 4. Добавьте код языка в этот список
  #
  # По умолчанию только русский язык. Для мультиязычности раскомментируйте нужные:
  available_languages:
    - ru
    # - en  # Раскомментируйте для английского


# ==============================================================================
# ЮРИДИЧЕСКИЕ ДОКУМЕНТЫ
# ==============================================================================
#
# Согласие с юридическими документами (оферта, политика конфиденциальности).
#
# Зачем это нужно:
# - ФЗ-152 (РФ): требует согласия на обработку персональных данных
# - GDPR (ЕС): требует явного согласия на обработку данных
# - Защита бизнеса: оферта определяет правила использования и оплаты
#
# Как работает:
# 1. При первом /start новому пользователю показывается запрос на согласие
# 2. Пользователь видит кнопки с ссылками на документы
# 3. После нажатия "Принимаю" — начисляется регистрационный бонус
# 4. Если версия документов изменилась — повторный запрос при входе
#
# Если enabled=false:
#   - Согласие не запрашивается (подходит для тестирования)
#   - Бонус начисляется сразу при регистрации

legal:
  # Включить/выключить проверку согласия с документами.
  # true = новым пользователям показывается запрос на согласие.
  # false = согласие не запрашивается.
  #
  # ВАЖНО: Для публичного запуска с платными услугами enabled должен быть true!
  enabled: false

  # Версия юридических документов.
  # Формат: "major.minor" (например, "1.0", "1.1", "2.0").
  #
  # Когда менять версию:
  #   - Изменились существенные условия оферты → новая major версия (1.0 → 2.0)
  #   - Мелкие правки и уточнения → новая minor версия (1.0 → 1.1)
  #
  # При изменении версии:
  #   1. Обновите документы в Google Docs / на сайте
  #   2. Измените version здесь
  #   3. Пользователям при следующем использовании бота покажется запрос
  #      на повторное согласие с новой версией документов
  version: "1.0"

  # Ссылка на Политику конфиденциальности.
  # Документ должен быть доступен по этой ссылке всем пользователям.
  #
  # Варианты размещения:
  #   - Google Docs: https://docs.google.com/document/d/XXXXX/view
  #   - Notion: https://notion.so/your-page-id
  #   - Ваш сайт: https://yoursite.com/privacy
  #
  # Шаблон документа: docs/legal/privacy_policy_template.md
  # Оставьте пустым, если документы ещё не готовы (бот предупредит о настройке).
  privacy_policy_url: ""

  # Ссылка на Пользовательское соглашение (оферту).
  # Документ должен быть доступен по этой ссылке всем пользователям.
  #
  # Варианты размещения: аналогично privacy_policy_url.
  #
  # Шаблон документа: docs/legal/terms_of_service_template.md
  # Оставьте пустым, если документы ещё не готовы.
  terms_of_service_url: ""


# ==============================================================================
# БИЛЛИНГ (СИСТЕМА ТОКЕНОВ)
# ==============================================================================
#
# Настройки монетизации бота через внутренние токены.
#
# Как работает система:
# 1. При регистрации пользователь получает registration_bonus токенов
# 2. Каждая генерация списывает токены с баланса
# 3. Стоимость генерации зависит от модели (см. models.*.price_tokens выше)
# 4. Если баланс < стоимости — генерация отклоняется
# 5. Пользователь может купить токены в боте
#
# Если enabled=false:
#   - Все генерации бесплатны (токены не списываются)
#   - Бонус при регистрации не начисляется
#   - Полезно для тестирования и закрытых бета-версий

billing:
  # Включить/выключить систему биллинга.
  # false = все генерации бесплатны (режим тестирования).
  # true = токены списываются за генерации (боевой режим).
  enabled: false

  # Бонусные токены при регистрации (первый /start).
  # 0 = бонус отключён, новые пользователи начинают с нуля.
  #
  # Рекомендуемое значение: 50-200 токенов
  #   - Достаточно для знакомства с ботом
  #   - Не слишком много, чтобы стимулировать покупку
  #
  # При стоимости chat=5-20 токенов, 100 токенов хватит на 5-20 текстовых генераций.
  registration_bonus: 10

  # Количество дней для повторных попыток списания подписки.
  # При неудачном списании система будет пытаться списать раз в день
  # в течение указанного количества дней (в 09:00 по Москве / 06:00 UTC).
  # После достижения лимита подписка помечается как expired.
  # Рекомендуемое значение: 3-7 дней.
  renewal_retry_days: 5


# ==============================================================================
# ТАРИФЫ (ПОКУПКА ТОКЕНОВ)
# ==============================================================================
#
# Пакеты токенов для покупки пользователями.
# Каждый тариф имеет:
#   - slug — уникальный идентификатор (используется в коде и webhook'ах)
#   - name — название на разных языках (показывается пользователю)
#   - tokens — количество токенов в пакете
#   - price — цены в разных валютах (для разных провайдеров)
#   - enabled — включён ли тариф (false = не показывается пользователю)
#
# Валюты и провайдеры:
#   - rub — цена в рублях (YooKassa)
#   - usd — цена в долларах (Stripe)
#   - stars — цена в Telegram Stars
#
# ВАЖНО: Порядок тарифов в этом списке = порядок отображения пользователю.
# Рекомендуется располагать от меньшего к большему.

tariffs:
  # ==========================================================================
  # РАЗОВАЯ ПОКУПКА (one_time)
  # ==========================================================================
  #
  # Пользователь покупает пакет токенов один раз.
  # Токены остаются на балансе пока не будут потрачены.

  starter:
    slug: starter
    type: one_time
    name:
      ru: "Стартовый"
      en: "Starter"
    tokens: 100
    price:
      stars: 1
      rub: 99
    enabled: true

  # ==========================================================================
  # ПОДПИСКА (subscription)
  # ==========================================================================
  #
  # Подписка предоставляет токены каждый месяц с автопродлением.
  # Telegram сам управляет продлением подписок через Stars.

  starter_monthly:
    slug: starter_monthly
    type: subscription
    name:
      ru: "Стартовая подписка"
      en: "Starter subscription"
    description:
      ru: "100 токенов каждый месяц"
      en: "100 tokens every month"
    tokens_per_period: 100
    period_days: 30
    burn_unused: true
    price:
      stars: 1
      rub: 99
    enabled: true


# ==============================================================================
# ПРОВАЙДЕРЫ ОПЛАТЫ
# ==============================================================================
#
# Настройки платёжных провайдеров для покупки токенов.
#
# Поддерживаемые провайдеры:
#   - Telegram Stars — встроенная валюта Telegram (работает из коробки)
#   - YooKassa — для платежей в рублях (Россия)
#   - Stripe — для международных платежей (USD)
#
# Провайдер доступен пользователям если:
#   1. Он включён в этом разделе (enabled: true)
#   2. Настроены необходимые переменные окружения (для YooKassa и Stripe)
#
# Telegram Stars не требует переменных окружения — работает через Telegram Bot API.
# YooKassa и Stripe включаются автоматически при наличии ключей в .env.

payments:
  # --------------------------------------------------------------------------
  # Telegram Stars
  # --------------------------------------------------------------------------
  #
  # Встроенная валюта Telegram для оплаты внутри ботов.
  # НЕ ТРЕБУЕТ регистрации и внешних ключей!
  #
  # Преимущества:
  #   - Работает сразу (не нужны документы, регистрация в платёжках)
  #   - Пользователь платит прямо в Telegram (без редиректов)
  #   - Поддержка подписок с автопродлением (Telegram сам управляет)
  #
  # Курс: примерно 1 Star ≈ $0.02 (устанавливается Telegram)
  # Вывод средств: через Fragment (https://fragment.com)
  #
  telegram_stars:
    enabled: true

  # --------------------------------------------------------------------------
  # YooKassa (ЮKassa)
  # --------------------------------------------------------------------------
  #
  # Российская платёжная система для приёма платежей в рублях.
  # Поддерживает: банковские карты, ЮMoney, SberPay, Tinkoff и др.
  #
  # Включается автоматически если указаны переменные окружения:
  #   PAYMENTS__YOOKASSA__SHOP_ID     — ID магазина из личного кабинета
  #   PAYMENTS__YOOKASSA__SECRET_KEY  — Секретный ключ API
  #
  # Как подключить:
  #   1. Зарегистрируйтесь на https://yookassa.ru
  #   2. Подключите магазин (потребуются документы ИП/ООО)
  #   3. В личном кабинете → Интеграция → Ключи API
  #   4. Создайте секретный ключ и скопируйте Shop ID
  #
  # Для тестирования используйте тестовый магазин (shop_id начинается с test_)
  # Тестовые карты: https://yookassa.ru/developers/payment-acceptance/testing
  #
  # yookassa:
  #   # Дополнительные настройки (если понадобятся в будущем)

  # --------------------------------------------------------------------------
  # Stripe
  # --------------------------------------------------------------------------
  #
  # Международная платёжная система для приёма платежей в USD/EUR.
  # Поддерживает: банковские карты, Apple Pay, Google Pay и др.
  #
  # Включается автоматически если указаны переменные окружения:
  #   PAYMENTS__STRIPE__SECRET_KEY     — Секретный ключ API (sk_live_... или sk_test_...)
  #   PAYMENTS__STRIPE__WEBHOOK_SECRET — Секрет для проверки webhook (whsec_...)
  #
  # Как подключить:
  #   1. Зарегистрируйтесь на https://stripe.com
  #   2. В Dashboard → Developers → API keys
  #   3. Скопируйте Secret key
  #   4. Настройте webhook: Dashboard → Developers → Webhooks
  #      URL: https://your-domain.com/api/webhooks/stripe
  #
  # Для тестирования используйте тестовые ключи (sk_test_...)
  # Тестовая карта: 4242 4242 4242 4242
  #
  # stripe:
  #   # Дополнительные настройки (если понадобятся в будущем)


# ==============================================================================
# РАССЫЛКИ
# ==============================================================================
#
# Настройки массовой отправки сообщений пользователям.
# Рассылки создаются и управляются через админку (/admin/broadcast).
#
# Telegram API имеет ограничения:
#   - Не более 30 сообщений в секунду (при массовой рассылке)
#   - При превышении — ошибка FloodWait с указанием времени ожидания
#
# BroadcastWorker автоматически:
#   - Соблюдает rate limiting (messages_per_second)
#   - Обрабатывает FloodWait (ждёт указанное время × multiplier)
#   - Сохраняет прогресс после каждого batch_size сообщений
#   - Возобновляет рассылку после перезапуска бота

broadcast:
  # Включить/выключить систему рассылок.
  # Если false — раздел рассылок недоступен в админке.
  enabled: true

  # Количество сообщений в секунду.
  # Telegram ограничивает до 30 msg/sec, но рекомендуется держать запас.
  #   - 25-30: оптимально для большинства случаев
  #   - 15-20: консервативно, меньше шансов на FloodWait
  #   - 30: максимум, но высокий риск FloodWait
  # Если получаете много FloodWait — уменьшите это значение.
  messages_per_second: 25

  # Размер батча для сохранения прогресса.
  # После каждых batch_size сообщений прогресс сохраняется в БД.
  # Это позволяет возобновить рассылку после перезапуска бота.
  #   - 50-100: оптимально (частое сохранение, но не слишком нагружает БД)
  #   - 10-50: для критичных рассылок (чаще сохраняем)
  #   - 100-500: для больших рассылок (реже сохраняем, меньше нагрузка)
  batch_size: 50

  # Количество повторных попыток при временной ошибке сети/API.
  # НЕ относится к FloodWait (он обрабатывается отдельно).
  #   - 0: не повторять, сразу отмечать как failed
  #   - 3: стандартное значение (достаточно для временных сбоев)
  #   - 5-10: для нестабильного соединения
  retry_on_error: 3

  # Множитель для времени ожидания FloodWait.
  # Telegram возвращает retry_after (секунды).
  # Реальное ожидание = retry_after × flood_wait_multiplier.
  #   - 1.0: точное время (рискованно, может снова получить FloodWait)
  #   - 1.2: небольшой запас (рекомендуется)
  #   - 1.5-2.0: консервативно (для стабильности)
  flood_wait_multiplier: 1.2


# ==============================================================================
# РЕФЕРАЛЬНАЯ ПРОГРАММА
# ==============================================================================
#
# Пользователи могут приглашать друзей и получать бонусы за каждого приглашённого.
#
# Как работает:
# 1. Пользователь получает персональную ссылку через /invite
# 2. Формат ссылки: https://t.me/botname?start=ref_USERID
# 3. Когда друг переходит по ссылке и регистрируется:
#    - Приглашённый получает invitee_bonus токенов
#    - Пригласивший получает inviter_bonus токенов
# 4. Пригласивший может заработать максимум max_earnings токенов
#
# Защита от злоупотреблений:
# - Нельзя пригласить самого себя
# - Один telegram_id = один бонус (повторная регистрация не даёт бонус)
# - Лимит заработка через max_earnings

referral:
  # Включить/выключить реферальную программу.
  # Если false — команда /invite автоматически отключается.
  enabled: true

  # Бонус пригласившему за каждого нового реферала (в токенах).
  # Начисляется когда приглашённый регистрируется (или делает первый платёж, если require_payment=true).
  # Рекомендуемое значение: 30-100 токенов.
  inviter_bonus: 50

  # Бонус приглашённому при регистрации (в токенах).
  # Дополнительный бонус к registration_bonus из секции billing.
  # Рекомендуемое значение: 10-50 токенов.
  invitee_bonus: 25

  # Максимум токенов, которые можно заработать на рефералах.
  # После достижения лимита inviter_bonus больше не начисляется.
  # 0 = без лимита (не рекомендуется в продакшене).
  # При inviter_bonus=50 и max_earnings=5000 — лимит 100 приглашённых.
  max_earnings: 5000

  # Если true — бонус пригласившему начисляется только после первой оплаты
  # приглашённого. Защита от фродеров, которые создают фейковые аккаунты.
  # false = бонус сразу при регистрации (проще, но менее защищено).
  # ВАЖНО: Рекомендуется true для продакшена, чтобы предотвратить создание
  # фейковых аккаунтов для накрутки бонусов.
  require_payment: true


# ==============================================================================
# ПОДДЕРЖКА ПОЛЬЗОВАТЕЛЕЙ
# ==============================================================================
#
# Контактная информация для обращения в техподдержку.
# Отображается в команде /help.

support:
  # Контакт для обращения в поддержку.
  #
  # Может быть:
  #   - Username Telegram: @support_username или @admin
  #   - Ссылка на чат поддержки: https://t.me/support_chat
  #   - Email: support@example.com
  #
  # Если оставить пустым "" — команда /help покажет сообщение
  # без контакта поддержки (только общую информацию о боте).
  #
  # Рекомендуется использовать Telegram-контакт для удобства пользователей.
  contact: "@support"


# ==============================================================================
# ПРОВЕРКА ПОДПИСКИ НА КАНАЛ
# ==============================================================================
#
# Настройки кеширования проверки подписки на канал.
# ID канала задаётся через переменную окружения CHANNEL__REQUIRED_ID.
#
# Если CHANNEL__REQUIRED_ID не задан — проверка подписки отключена,
# и эти настройки игнорируются.
#
# Как настроить обязательную подписку:
# 1. Создайте канал в Telegram
# 2. Добавьте бота в администраторы канала
# 3. Узнайте ID канала (через @userinfobot — перешлите сообщение из канала)
# 4. Добавьте в .env: CHANNEL__REQUIRED_ID=-1001234567890
# 5. Опционально: CHANNEL__INVITE_LINK=@yourchannel (для кнопки "Подписаться")

channel_subscription:
  # Время жизни кеша результата проверки подписки (в секундах).
  #
  # Зачем нужен кеш:
  # - Telegram API имеет лимиты на количество запросов
  # - Проверять подписку на каждое сообщение — слишком накладно
  # - Кеш хранит результат проверки и использует его повторно
  #
  # Как работает:
  # 1. Пользователь отправляет сообщение
  # 2. Если в кеше есть результат и он не устарел — используем его
  # 3. Если кеша нет или он устарел — делаем запрос к Telegram API
  # 4. Результат сохраняется в кеш на cache_ttl_seconds секунд
  #
  # Рекомендуемые значения:
  #   60-120   — для активных ботов (частая проверка, но больше запросов)
  #   300      — оптимальный баланс (5 минут)
  #   600-900  — для экономии запросов к API (10-15 минут)
  #
  # ВАЖНО: После подписки пользователь может ждать до cache_ttl_seconds,
  # прежде чем бот "увидит" его подписку. Слишком большой TTL может
  # раздражать пользователей.
  cache_ttl_seconds: 300
